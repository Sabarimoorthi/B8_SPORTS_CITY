<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B8 SPORTS CITY | Official Web Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Outfit:wght@400;600;700;800;900&family=Permanent+Marker&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --gold-bright: #ffd700;
            --gold-main: #f5e1a4;
            --gold-dark: #c9a050;
            --gold-glow: rgba(245, 225, 164, 0.4);
            --gold-glow-strong: rgba(255, 215, 0, 0.85);
        }

        html,
        body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Completely prevents vertical & horizontal scrolling */
        }

        body {
            font-family: 'Outfit', 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        /* Golden Gradient Text Effect */
        .text-gradient-gold {
            background: linear-gradient(135deg, #FFF6D1 0%, #FFD700 45%, #C9A050 80%, #E6C280 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-gold-bright {
            background: linear-gradient(180deg, #FFFFFF 0%, #FFEA79 50%, #FFC800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Multi-ring Golden Edge Effect for Emblem */
        .gold-ring-container {
            position: relative;
            border-radius: 50%;
            padding: 4px;
            background: radial-gradient(circle, rgba(201, 160, 80, 0.2) 0%, transparent 70%);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .gold-ring-outer {
            border: 2px solid var(--gold-dark);
            border-radius: 50%;
            padding: 3px;
            box-shadow: inset 0 0 10px var(--gold-glow), 0 0 10px var(--gold-glow);
            position: relative;
        }

        .gold-ring-outer::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 215, 0, 0.5);
            animation: spin 30s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .gold-ring-inner {
            border: 2px solid var(--gold-bright);
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.35);
            overflow: hidden;
            width: 100rem;
            /* or whatever pixel/rem size you prefer */
            height: 38rem;
        }

        /* Continuous Pulsing/Blinking Special Effect for Action Buttons */
        @keyframes pulseBlinkGlow {

            0%,
            100% {
                box-shadow: 0 0 10px var(--gold-glow), inset 0 0 6px rgba(255, 215, 0, 0.2);
                border-color: var(--gold-dark);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 25px var(--gold-glow-strong), inset 0 0 15px var(--gold-glow-strong);
                border-color: #ffffff;
                transform: scale(1.05);
            }
        }

        .action-btn-circle {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid var(--gold-bright);
            background: radial-gradient(circle, rgba(25, 25, 25, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
            animation: pulseBlinkGlow 2.2s infinite ease-in-out;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-whatsapp .action-btn-circle {
            animation-delay: 0s;
        }

        .btn-instagram .action-btn-circle {
            animation-delay: 0.5s;
        }

        .btn-shop .action-btn-circle {
            animation-delay: 1.0s;
        }

        .btn-visit .action-btn-circle {
            animation-delay: 1.5s;
        }

        @media (min-width: 768px) {
            .action-btn-circle {
                width: 88px;
                height: 88px;
            }
        }

        .action-btn-group:hover .action-btn-circle {
            animation-play-state: paused;
            transform: translateY(-4px) scale(1.08) !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 30px var(--gold-glow-strong), inset 0 0 18px var(--gold-glow-strong) !important;
        }

        .corner-accent-tl {
            position: absolute;
            top: 0;
            left: 0.5rem;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-dark) 40%, transparent 40%);
            opacity: 0.85;
            pointer-events: none;
        }

        .corner-accent-br {
            position: absolute;
            bottom: 0;
            right: 0.5rem;
            width: 100px;
            height: 100px;
            background: linear-gradient(315deg, var(--gold-bright) 0%, var(--gold-dark) 40%, transparent 40%);
            opacity: 0.85;
            pointer-events: none;
        }

        .vignette-overlay {
            background: radial-gradient(circle at center, rgba(5, 5, 5, 0.6) 20%, rgba(5, 5, 5, 0.88) 75%, rgba(5, 5, 5, 0.96) 100%);
        }

        .gold-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--gold-dark) 20%, var(--gold-bright) 50%, var(--gold-dark) 80%, transparent 100%);
            box-shadow: 0 0 8px var(--gold-glow-strong);
        }

        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="corner-accent-tl z-20 hidden sm:block"></div>
    <div class="corner-accent-br z-20 hidden sm:block"></div>

    <!-- Background Image Set to image_fac729.jpg -->
    <div class="fixed inset-0 z-0 opacity-35 bg-cover bg-center pointer-events-none vignette-overlay"

    <!-- Header & Logo Badge -->

        <div

            <span class="text-amber-400">•</span>
            <span>TROPHIES</span>

                    <div class="action-btn-circle">
                        <svg class="w-7 h-7 sm:w-9 sm:h-9 text-amber-300 group-hover:text-white transition-colors"

                                d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.762.459 3.48 1.332 5.001L2 22l5.12-1.338c1.464.798 3.111 1.22 4.887 1.221h.005c5.505 0 9.988-4.478 9.989-9.985 0-2.668-1.038-5.176-2.926-7.062A9.922 9.922 0 0 0 12.012 2zm5.836 14.124c-.252.71-1.246 1.302-2.023 1.472-.532.115-1.227.208-3.565-.765-2.993-1.245-4.918-4.3-5.068-4.5-.148-.2-1.218-1.621-1.218-3.092 0-1.472.771-2.196 1.045-2.492.274-.296.6-.37.8-.37.2 0 .4 0 .573.01.185.008.435-.07.68.518.252.607.86 2.098.934 2.248.075.15.125.325.025.523-.1.197-.15.32-.298.494-.148.173-.312.387-.446.52-.148.148-.302.31-.13.606.173.296.768 1.267 1.65 2.052 1.134 1.01 2.091 1.323 2.387 1.471.296.148.47.123.643-.074.173-.197.74-.863.938-1.16.197-.296.395-.246.666-.148.271.099 1.725.813 2.021.961.296.148.493.222.567.345.074.123.074.715-.178 1.425z" />
                        </svg>
                    </div>
                    <span
                        class="mt-2 text-[10px] sm:text-xs font-extrabold tracking-widest text-gray-200 group-hover:text-amber-300 uppercase transition-colors">
                        WHATSAPP

                </a>
            </div>

            <div class="btn-instagram">
                <a href="https://www.instagram.com/b8_sports_city?utm_source=qr&stkn=MXc2Z2xiYWt3dG1scw%3D%3D" target="_blank"
                    onclick="showToast('Redirecting to B8 Sports City Instagram Page...');"
                    class="action-btn-group flex flex-col items-center group cursor-pointer">

                        </svg>
                    </div>

            <div class="btn-shop">
                <a href="https://wa.me/c/919080084596" target="_blank" rel="noopener noreferrer"

                    <div class="action-btn-circle">
                        <svg class="w-7 h-7 sm:w-9 sm:h-9 text-amber-300 group-hover:text-white transition-colors"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1-1V8h2v12z" />

                    <span
                        class="mt-2 text-[10px] sm:text-xs font-extrabold tracking-widest text-gray-200 group-hover:text-amber-300 uppercase transition-colors">
                        SHOP NOW
                    </span>
                </a>
            </div>

            <div class="btn-visit">
                <a href="https://maps.google.com/?q=B8+Sports+City" target="_blank"
                    onclick="showToast('Opening Google Maps location for B8 Sports City...');"
                    class="action-btn-group flex flex-col items-center group cursor-pointer">
                    <div class="action-btn-circle">
                        <svg class="w-7 h-7 sm:w-9 sm:h-9 text-amber-300 group-hover:text-white transition-colors"
                            fill="currentColor" viewBox="0 0 24 24">

                                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />

        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full py-2 px-4 text-center">
        <div class="w-full max-w-xs mx-auto gold-divider mb-2"></div>
        <p class="text-[10px] sm:text-xs font-extrabold tracking-[0.2em] text-gradient-gold uppercase">
            PLAY • TRAIN • ACHIEVE TOGETHER
        </p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-black font-bold px-5 py-2.5 rounded-full shadow-[0_0_15px_rgba(255,215,0,0.8)] opacity-0 pointer-events-none transform translate-y-4 transition-all duration-300 text-xs text-center">
        Notification Message
    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>

</html>
