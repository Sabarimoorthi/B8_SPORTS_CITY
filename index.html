<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8 SPORTS CITY | Official Web Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --gold-bright: #ffd700;
            --gold-main: #f5e1a4;
            --gold-dark: #c9a050;
            --gold-glow: rgba(245, 225, 164, 0.4);
            --gold-glow-strong: rgba(255, 215, 0, 0.65);
        }

        body {
            font-family: 'Outfit', 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }

        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        /* Golden Gradient Text Effect */
        .text-gradient-gold {
            background: linear-gradient(135deg, #FFF6D1 0%, #FFD700 45%, #C9A050 80%, #E6C280 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-gold-bright {
            background: linear-gradient(180deg, #FFFFFF 0%, #FFEA79 50%, #FFC800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Multi-ring Golden Edge Effect for Emblem */
        .gold-ring-container {
            position: relative;
            border-radius: 50%;
            padding: 8px;
            background: radial-gradient(circle, rgba(201, 160, 80, 0.15) 0%, transparent 70%);
            box-shadow: 0 0 35px var(--gold-glow);
        }

        .gold-ring-outer {
            border: 2px solid var(--gold-dark);
            border-radius: 50%;
            padding: 4px;
            box-shadow: inset 0 0 15px var(--gold-glow), 0 0 15px var(--gold-glow);
            position: relative;
        }

        .gold-ring-outer::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 215, 0, 0.5);
            animation: spin 30s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .gold-ring-inner {
            border: 3px solid var(--gold-bright);
            border-radius: 50%;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.35);
        }

        /* Action Buttons Golden Glow Circles */
        .action-btn-circle {
            position: relative;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid var(--gold-bright);
            background: radial-gradient(circle, rgba(20, 20, 20, 0.9) 0%, rgba(5, 5, 5, 0.95) 100%);
            box-shadow: 0 0 18px var(--gold-glow), inset 0 0 10px rgba(255, 215, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .action-btn-circle {
                width: 95px;
                height: 95px;
            }
        }

        .action-btn-group:hover .action-btn-circle {
            transform: translateY(-6px) scale(1.06);
            border-color: #ffffff;
            box-shadow: 0 0 30px var(--gold-glow-strong), inset 0 0 18px var(--gold-glow-strong);
        }

        /* Custom Corner Accents */
        .corner-accent-tl {
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-dark) 40%, transparent 40%);
            opacity: 0.85;
            pointer-events: none;
        }

        .corner-accent-br {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 140px;
            height: 140px;
            background: linear-gradient(315deg, var(--gold-bright) 0%, var(--gold-dark) 40%, transparent 40%);
            opacity: 0.85;
            pointer-events: none;
        }

        /* Vignette Dark Overlay */
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 5, 5, 0.8) 80%, rgba(5, 5, 5, 0.98) 100%);
        }

        /* Horizontal Golden Divider Light Bar */
        .gold-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--gold-dark) 20%, var(--gold-bright) 50%, var(--gold-dark) 80%, transparent 100%);
            box-shadow: 0 0 10px var(--gold-glow-strong);
        }

        /* Toast notification */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative bg-black text-white antialiased selection:bg-amber-500 selection:text-black">

                    </svg>

                    WHATSAPP

            </a>

            <!-- Instagram Action Button -->
            <a href="https://instagram.com" 
               target="_blank" 
               onclick="showToast('Redirecting to B8 Sports City Instagram Page...');"

                    <!-- Instagram SVG Icon -->

                    </svg>
                </div>

                    INSTAGRAM

            </a>

            <!-- Shop Now Action Button -->
            <button onclick="showToast('Online Store catalog opening shortly! Call 90800 84596 for instant orders.');" 
                    class="action-btn-group flex flex-col items-center group cursor-pointer focus:outline-none">
                <div class="action-btn-circle">
                    <!-- Storefront SVG Icon -->
                    <svg class="w-8 h-8 sm:w-10 sm:h-10 text-amber-300 group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">

            <!-- Visit Us Action Button -->

               target="_blank"

                    <svg class="w-8 h-8 sm:w-10 sm:h-10 text-amber-300 group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">

        </div>

    </main>

    <footer class="relative z-10 w-full py-4 px-4 text-center">
        <div class="w-full max-w-lg mx-auto gold-divider mb-3"></div>
        <!-- Bottom Tagline -->
        <p class="text-xs sm:text-sm font-extrabold tracking-[0.2em] text-gradient-gold uppercase">
            PLAY • TRAIN • ACHIEVE TOGETHER
        </p>
    </footer>

    <!-- Interactive Toast Notification Popup -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-black font-bold px-6 py-3 rounded-full shadow-[0_0_20px_rgba(255,215,0,0.8)] opacity-0 pointer-events-none transform translate-y-4 transition-all duration-300 text-xs sm:text-sm text-center">
        Notification Message
    </div>

    <script>
        // Interactive Toast Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
