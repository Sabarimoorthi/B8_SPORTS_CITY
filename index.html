<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>B8 Sports City</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- DESKTOP / TV -->
    <section class="artboard desktop-artboard" aria-label="B8 Sports City desktop poster">
      <img class="poster" src="assets/desktop.png" alt="B8 Sports City desktop design">

      <!-- Invisible clickable hotspots with synchronized blinking gold rings -->
      <a class="hotspot desktop-hotspot whatsapp" href="https://wa.me/919080084596"
         target="_blank" rel="noopener" aria-label="WhatsApp"></a>

      <a class="hotspot desktop-hotspot instagram" href="https://www.instagram.com/b8_sports_city/"
         target="_blank" rel="noopener" aria-label="Instagram"></a>

      <a class="hotspot desktop-hotspot shop" href="https://wa.me/c/919080084596"
         target="_blank" rel="noopener" aria-label="Shop Now"></a>

      <a class="hotspot desktop-hotspot location" href="https://www.google.com/maps/search/?api=1&query=B8%20Sports%20City" target="_blank" rel="noopener" aria-label="Visit Us"></a>

      <!-- This is an image, not CSS-drawn text/arrow. -->
   
    </section>

    <!-- MOBILE -->
    <section class="artboard mobile-artboard" aria-label="B8 Sports City mobile poster">
      <img class="poster" src="assets/mobile.png" alt="B8 Sports City mobile design">

      <a class="hotspot mobile-hotspot whatsapp" href="https://wa.me/919080084596"
         target="_blank" rel="noopener" aria-label="WhatsApp"></a>

      <a class="hotspot mobile-hotspot instagram" href="https://www.instagram.com/b8_sports_city/"
         target="_blank" rel="noopener" aria-label="Instagram"></a>

      <a class="hotspot mobile-hotspot shop" href="https://wa.me/c/919080084596"
         target="_blank" rel="noopener" aria-label="Shop Now"></a>

      <a class="hotspot mobile-hotspot location" href="https://www.google.com/maps/search/?api=1&query=B8%20Sports%20City" target="_blank" rel="noopener" aria-label="Visit Us"></a>

      <img class="click-arrow mobile-arrow"
           src="assets/click_here_arrow.png"
           alt="Click here">
    </section>

  </main>
</body>
</html>
